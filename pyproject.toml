[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobcal-sync"
version = "0.1.0"
description = "관심기업 채용공고 마감일을 Google Calendar 에 멱등 동기화"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.120",
    "google-auth>=2.29",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "protego>=0.3.0",
]

[project.optional-dependencies]
# 사다리 수집(브라우저 렌더링·세션)이 필요한 소스를 쓸 때만 설치한다.
# 사람인/원티드는 평문 JSON 이라 코어만으로 돌고, CI 에서 Chromium 을 받지 않는다.
crawl = ["scrapling[fetchers]>=0.4.8,<0.5"]
dev = ["pytest>=8.0"]

[project.scripts]
jobcal = "jobcal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 벤더링한 라이선스 전문과 수집 레시피도 설치물에 함께 넣는다.
"jobcal.vendor" = ["LICENSE.web-crawler", "fingerprints/*/*.json"]

[tool.pytest.ini_options]
# pythonpath 를 일부러 두지 않는다.
#
# 예전에는 pythonpath = ["src", "vendor"] 였고, 그래서 테스트가 소스 트리를 직접
# import 했다. 그 결과 '설치했을 때 import 되는가' 를 아무도 검사하지 않았고,
# vendor 가 설치물에 빠지는 버그를 테스트가 전부 통과한 채로 놓쳤다.
# 이제는 설치된 패키지를 쓴다 — 먼저 `pip install -e '.[dev]'` 가 필요하다.
testpaths = ["tests"]
