# 관심기업 채용공고 → Google Calendar 동기화 설정
#
# 자격증명은 여기 두지 않는다. 이 파일은 커밋되고, 키는 환경변수로 들어온다.
#   GOOGLE_CALENDAR_ID            대상 캘린더 id (설정의 calendar_id 보다 우선)
#   GOOGLE_SERVICE_ACCOUNT_JSON   서비스 계정 키 JSON 전문
#   SARAMIN_ACCESS_KEY            사람인 Open API access-key

# 캘린더 id. Google Calendar > 해당 캘린더 설정 > '캘린더 통합' 에서 확인.
# 환경변수 GOOGLE_CALENDAR_ID 가 있으면 그쪽이 우선한다.
calendar_id: ""

# 관심기업. 사람인 API 는 이 이름을 keywords 로 넣어 회사당 1회씩 질의한다.
# 전체를 긁어와 걸러내는 게 아니라 좁혀 물어보는 구조라 호출량이 회사 수에 비례한다.
# 20곳이면 하루 20회 — 사람인 1일 상한 500회에 한참 여유가 있다.
companies:
  - PNP시큐어
  - 삼성전자
  - 토스랩
  - 안랩
  - 네이버클라우드

# 한 번의 실행에서 기존 일정의 이 비율을 넘게 지우려 하면 멈춘다.
# 공고가 하루에 3분의 1 넘게 한꺼번에 마감되는 일보다, 수집이 깨진 쪽이 흔하다.
max_delete_ratio: 0.34

# true 면 계획만 로그로 찍고 캘린더는 건드리지 않는다. 처음 돌릴 때 켜두는 것을 권한다.
dry_run: false

sources:
  # 1차 소스 — 공식 Open API.
  # active 와 expiration-timestamp 를 주기 때문에 '마감됨' 과 '수집 실패' 가 구분된다.
  # 출처 표기 의무가 있다: Powered by 취업 사람인 (https://www.saramin.co.kr)
  saramin:
    enabled: true
    max_pages: 2            # 회사당 최대 페이지 (count=110 이라 2면 220건)
    delay: 1.0
    max_requests: 200       # 하루 상한 500회에 대한 자체 안전선
    directhire_only: true   # 헤드헌팅·파견 공고 제외

  # 2차 소스 — 비공식 공개 JSON API. 기본값 비활성.
  #
  # ⚠ 실측(2026-10): 이 엔드포인트는 CloudFront + AWS WAF 뒤에 있고
  #   '403 ERROR / Request blocked' 로 거절됩니다. AWS 문서 기준으로 이 메시지는
  #   오리진 장애가 아니라 WAF 규칙이 요청을 의도적으로 차단한 경우입니다.
  #   데이터센터 IP 대역은 WAF 가 흔히 막는 대상이라, GitHub Actions·Codespaces 에서는
  #   켜도 거의 통하지 않습니다. 코드는 차단을 만나면 재시도하지 않고 멈추고,
  #   그 소스의 일정은 마감 판정에서 제외합니다(캘린더가 비워지지 않습니다).
  #
  # 켜기 전에 두 가지를 직접 확인하세요. 이 코드가 대신 판단하지 않습니다:
  #   1. https://www.wanted.co.kr/robots.txt
  #   2. 원티드 이용약관
  # 확인했으면 acknowledged_robots 를 true 로 바꾸세요.
  #
  # 회사명으로 좁혀 질의할 수 없어서 목록을 페이징하며 클라이언트에서 걸러야 합니다.
  # 페이지 예산이 먼저 떨어지면 결과를 전수로 믿지 않고 삭제 판정에서 제외합니다.
  # 상시채용이 대부분이라 마감일 없는 공고가 많고, 그건 CSV 에만 남습니다.
  wanted:
    enabled: false
    acknowledged_robots: false
    max_pages: 10
    delay: 1.5
    max_requests: 15
